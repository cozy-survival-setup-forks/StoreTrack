name: StoreTrack
version: '${version}'
main: dev.storetrack.StoreTrackPlugin
api-version: '1.21'
authors: [Groovyy Roy]
description: Store purchase tracking - rankings, community goals, fireworks, gg waves, Discord webhooks
softdepend: [PlaceholderAPI, Vault, FancyNpcs, floodgate]

commands:
  storetrack:
    description: Manage payments, goals, ggwaves and NPC skin refresh
    aliases: [strack]
    usage: /<command> reload|manual|payment|history|recent|goal|test|ggwave|npcrefresh

permissions:
  storetrack.admin:
    description: Full access to all StoreTrack admin subcommands
    default: op
